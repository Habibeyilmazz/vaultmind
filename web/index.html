<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>vaultmind</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="#/" aria-label="vaultmind, show the link graph">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <path d="M8 9l8 15 8-15" /><circle class="lit" cx="8" cy="9" r="3.4" /><circle cx="24" cy="9" r="3.4" /><circle cx="16" cy="24" r="3.4" />
        </svg>
        <span>vaultmind</span>
      </a>
      <form class="search" role="search" id="search-form">
        <label class="visually-hidden" for="q">Search your notes</label>
        <input id="q" type="search" placeholder="Search your notes" autocomplete="off" spellcheck="false" />
        <button type="button" id="ask" hidden title="Answer this question from your notes, with citations">Ask</button>
      </form>
      <p class="status" id="status" aria-live="polite"></p>
    </header>
    <div class="layout">
      <nav class="list" aria-labelledby="list-title">
        <!-- One live region, read as a whole, so a screen reader hears the result count and not only the hint under it. -->
        <div aria-live="polite" aria-atomic="true">
          <h2 id="list-title">Recent notes</h2>
          <p class="hint" id="list-hint"></p>
        </div>
        <ol id="list"></ol>
      </nav>
      <main id="main" tabindex="-1">
        <p class="problem loading">Opening your vault…</p>
        <noscript><p class="problem">The vaultmind web UI needs JavaScript. The command line and the MCP server work without a browser.</p></noscript>
      </main>
      <aside id="side" aria-label="Connections of this note" hidden></aside>
    </div>
  </body>
</html>
