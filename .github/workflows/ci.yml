name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.18.0 is the oldest Node the README promises; it also runs the browser tests.
          - { os: ubuntu-latest, node: "22.18.0", browser: true }
          - { os: ubuntu-latest, node: "24" }
          - { os: windows-latest, node: "22" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and MCP tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke-test the built CLI
        run: |
          node dist/cli.js index --vault examples/vault --no-embed
          node dist/cli.js search "feeding schedule" --vault examples/vault --no-embed | grep -q "Sourdough Starter"
      - name: Browser tests
        if: matrix.browser
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
