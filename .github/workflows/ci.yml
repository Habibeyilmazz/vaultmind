name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and MCP tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke-test the built CLI
        run: |
          node dist/cli.js index --vault examples/vault --no-embed
          node dist/cli.js search "feeding schedule" --vault examples/vault --no-embed | grep -q "Sourdough Starter"
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
